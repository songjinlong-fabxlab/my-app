<html lang="zh">

<title>数学错题辅导</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif;background:#f5f6fa;min-height:100vh;color:#1a1a2e}
.app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column;background:#fff}
.nav{display:flex;background:#fff;border-top:1px solid #eee;position:sticky;bottom:0;z-index:100}
.nav-btn{flex:1;padding:10px 4px 8px;border:none;background:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;color:#999;font-size:10px}
.nav-btn.active{color:#6c5ce7}
.nav-btn svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.page{display:none;flex:1;flex-direction:column;overflow-y:auto}
.page.active{display:flex}
.header{background:linear-gradient(135deg,#6c5ce7,#a29bfe);color:#fff;padding:20px 16px 24px;position:relative;overflow:hidden}
.header::after{content:'';position:absolute;right:-20px;top:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.header h1{font-size:20px;font-weight:600;margin-bottom:4px}
.header p{font-size:13px;opacity:.85}
.header .date{font-size:12px;opacity:.7;margin-top:6px}
.card{background:#fff;border-radius:14px;padding:16px;margin:12px 16px 0;box-shadow:0 2px 12px rgba(0,0,0,.06)}
.card-title{font-size:13px;color:#888;margin-bottom:10px}
.stats{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:12px 16px 0}
.stat{background:#f8f7ff;border-radius:12px;padding:12px 8px;text-align:center}
.stat-num{font-size:22px;font-weight:600;color:#6c5ce7}
.stat-label{font-size:11px;color:#888;margin-top:2px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px 16px 0}
.action-btn{background:#f8f7ff;border:none;border-radius:14px;padding:16px 12px;cursor:pointer;text-align:left}
.action-btn .icon{font-size:26px;margin-bottom:8px;display:block}
.action-btn span{font-size:13px;font-weight:500;color:#333;display:block}
.action-btn small{font-size:11px;color:#999;margin-top:2px;display:block}
.section{padding:16px 16px 0}
.section-title{font-size:15px;font-weight:600;color:#333;margin-bottom:10px;display:flex;align-items:center;justify-content:space-between}
.section-title a{font-size:12px;color:#6c5ce7;text-decoration:none;font-weight:400}
.mistake-item{background:#fff;border-radius:12px;border:1px solid #f0f0f0;padding:12px;margin-bottom:8px;display:flex;gap:10px}
.tag{background:#fff0f0;color:#e84393;font-size:11px;padding:2px 8px;border-radius:6px;white-space:nowrap;height:fit-content}
.tag.green{background:#f0fff4;color:#00b894}
.mistake-info h4{font-size:13px;color:#333;margin-bottom:4px;font-weight:500}
.badge{display:inline-block;font-size:11px;padding:2px 8px;border-radius:20px;margin:2px}
.badge-purple{background:#f0edff;color:#6c5ce7}
.badge-green{background:#f0fff4;color:#00b894}
.badge-amber{background:#fff8e1;color:#e67e22}
.upload-area{margin:16px;border:2px dashed #d0c8ff;border-radius:16px;padding:32px 16px;text-align:center;cursor:pointer;background:#fdfcff}
.upload-area .up-icon{font-size:48px;display:block;margin-bottom:12px}
.upload-area p{color:#888;font-size:14px}
.upload-area small{color:#bbb;font-size:12px;margin-top:4px;display:block}
#fileInput{display:none}
.preview-img{width:calc(100% - 32px);margin:0 16px;border-radius:12px;object-fit:contain;max-height:280px;display:block}
.btn-primary{background:#6c5ce7;color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:500;cursor:pointer;width:calc(100% - 32px);margin:12px 16px 0;display:block}
.btn-primary:disabled{opacity:.5;cursor:not-allowed}
.btn-secondary{background:#f0edff;color:#6c5ce7;border:none;border-radius:12px;padding:12px;font-size:14px;font-weight:500;cursor:pointer;width:calc(100% - 32px);margin:8px 16px 0;display:block}
.analysis-card{margin:12px 16px;background:#fff;border-radius:14px;border:1px solid #ede9fe;overflow:hidden}
.analysis-header{background:#f5f3ff;padding:12px 16px}
.analysis-header h3{font-size:14px;font-weight:600;color:#333}
.analysis-body{padding:14px 16px}
.problem-item{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid #f5f5f5}
.problem-item:last-child{margin-bottom:0;padding-bottom:0;border-bottom:none}
.problem-num{font-size:12px;font-weight:600;color:#6c5ce7;margin-bottom:4px}
.problem-desc{font-size:13px;color:#333;margin-bottom:6px}
.problem-answer{font-size:12px;color:#e84393;background:#fff0f5;padding:4px 8px;border-radius:6px;display:inline-block;margin:2px}

.knowledge-tags{display:flex;flex-wrap:wrap;gap:4px;margin-top:6px}
.week-header{background:linear-gradient(135deg,#00b894,#55efc4);color:#fff;padding:20px 16px}
.week-header h2{font-size:18px;font-weight:600}

.topic-card{background:#fff;border-radius:14px;margin:8px 16px;overflow:hidden;border:1px solid #f0f0f0}
.topic-header{padding:12px 16px;display:flex;align-items:center;justify-content:space-between;cursor:pointer}
.topic-name{font-size:14px;font-weight:600;color:#333}
.topic-body{padding:0 16px 14px;display:none}
.topic-body.open{display:block}
.exercise-item{background:#f8f7ff;border-radius:10px;padding:12px;margin-bottom:8px}

.report-header{background:linear-gradient(135deg,#fd79a8,#e84393);color:#fff;padding:20px 16px}

.progress-item{margin-bottom:12px}

.deferred-item{background:#fff8e1;border-left:3px solid #e67e22;border-radius:0 10px 10px 0;padding:10px 12px;margin-bottom:8px}

.loading{text-align:center;padding:32px 16px;color:#888}
.spin{display:inline-block;animation:spin 1.5s linear infinite}

.scroll-content{flex:1;overflow-y:auto;padding-bottom:80px}
.toast{position:fixed;bottom:80px;left:50%;transform:translateX(-50%);background:#333;color:#fff;padding:10px 20px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity .3s;pointer-events:none;white-space:nowrap}

      <option value="anthropic">Anthropic Claude</option>
      <option value="qwen">阿里千问 Qwen</option>
    </select>

<script>
// ==================== API ====================
var API_PROVIDERS = {
  anthropic: { name: 'Anthropic Claude', hint: '获取：console.anthropic.com' },
  qwen: { name: '阿里千问 Qwen', hint: '获取：dashscope.console.aliyun.com' }
};

// 检测是否在 Claude.ai 沙盒里运行
function isInSandbox() {
  var href = window.location.href;
  if (href === 'about:srcdoc') return true;
  if (href.startsWith('file://')) return false;
  if (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1') return false;
  // 有真实 hostname（包括 vercel.app）都不是沙盒
  if (window.location.hostname && window.location.hostname.length > 0) return false;
  return true;
}

function getProvider() {
  // 沙盒里强制用 Anthropic
  if (isInSandbox()) return 'anthropic';
  return localStorage.getItem('api-provider') || 'anthropic';
}
function getApiKey() { return localStorage.getItem('api-key-' + getProvider()) || ''; }

function openModal() {
  if (isInSandbox()) {
    showToast('✅ Claude.ai 中无需配置，已自动使用 Anthropic');
    return;
  }
  var p = getProvider();
  document.getElementById('modal-provider').value = p;
  document.getElementById('modal-key').value = localStorage.getItem('api-key-' + p) || '';
  updateModalHint();
  document.getElementById('modal-mask').style.display = 'flex';
}
function closeModal() { document.getElementById('modal-mask').style.display = 'none'; }
function updateModalHint() {
  var p = document.getElementById('modal-provider').value;
  document.getElementById('modal-hint').textContent = API_PROVIDERS[p] ? API_PROVIDERS[p].hint : '';
}
function saveApiKey() {
  var p = document.getElementById('modal-provider').value;
  var k = document.getElementById('modal-key').value.trim();
  if (!k) { showToast('⚠️ Key 不能为空'); return; }
  if (!k.startsWith('sk-')) { showToast('⚠️ Key 需以 sk- 开头'); return; }
  localStorage.setItem('api-provider', p);
  localStorage.setItem('api-key-' + p, k);
  closeModal();
  showToast('✅ ' + API_PROVIDERS[p].name + ' 配置已保存');
}

document.getElementById('modal-mask').addEventListener('click', function(e) {
  if (e.target === this) closeModal();
});

function callAI(opts) {
  var text = opts.text;
  var imageBase64 = opts.imageBase64;
  var mediaType = opts.mediaType;
  var timeoutMs = opts.timeoutMs || 30000;
  var provider = getProvider();
  var key = getApiKey();
  var url, headers, body;

  if (provider === 'qwen') {
    url = 'https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions';
    headers = { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + key };
    var content = [];
    if (imageBase64) content.push({ type: 'image_url', image_url: { url: 'data:' + mediaType + ';base64,' + imageBase64 } });
    content.push({ type: 'text', text: text });
    body = { model: 'qwen-vl-max', messages: [{ role: 'user', content: content }], max_tokens: 1500 };
  } else {
    // Claude.ai 沙盒：只允许 Content-Type，平台自动注入鉴权，不能加 x-api-key
    url = 'https://api.anthropic.com/v1/messages';
    headers = { 'Content-Type': 'application/json' };
    var content = [];
    if (imageBase64) content.push({ type: 'image', source: { type: 'base64', media_type: mediaType, data: imageBase64 } });
    content.push({ type: 'text', text: text });
    body = { model: 'claude-sonnet-4-20250514', max_tokens: 1500, messages: [{ role: 'user', content: content }] };
  }

  var fetchP = fetch(url, { method: 'POST', headers: headers, body: JSON.stringify(body) })
    .then(function(r) { return r.text().then(function(raw) { return { status: r.status, raw: raw }; }); })
    .then(function(res) {
      if (res.status === 401) { openModal(); throw new Error('API Key 无效，请重新设置'); }
      if (res.status === 429) throw new Error('请求频率超限，请稍后重试');
      if (res.status !== 200) throw new Error('HTTP ' + res.status + ': ' + res.raw.slice(0, 100));
      var data = JSON.parse(res.raw);
      if (data.error) throw new Error(data.error.message || 'API错误');
      if (provider === 'qwen') return (data.choices && data.choices[0] && data.choices[0].message && data.choices[0].message.content) || '';
      return data.content.map(function(c) { return c.text || ''; }).join('').trim();
    });

  var timeoutP = new Promise(function(_, reject) {
    setTimeout(function() { reject(new Error('请求超时，请重试')); }, timeoutMs);
  });

  return Promise.race([fetchP, timeoutP]);
}

// ==================== JSON 解析 ====================
function cleanJSON(text) {
  return text
    .replace(/```json|```/gi, '')
    .replace(/[\u201c\u201d]/g, '"')
    .replace(/[\u2018\u2019]/g, "'")
    .replace(/[\u2026]/g, '...')
    .replace(/[\u00a0]/g, ' ')
    .replace(/,\s*([}\]])/g, '$1')
    .trim();
}

function extractJSON(text) {
  text = cleanJSON(text);
  var results = [];
  var i = 0;
  while (i < text.length) {
    var start = text.indexOf('{', i);
    if (start === -1) break;
    var depth = 0, inStr = false, escape = false, ended = false;
    for (var j = start; j < text.length; j++) {
      var c = text[j];
      if (escape) { escape = false; continue; }
      if (c === '\\' && inStr) { escape = true; continue; }
      if (c === '"') { inStr = !inStr; continue; }
      if (inStr) continue;
      if (c === '{') depth++;
      else if (c === '}') {
        depth--;
        if (depth === 0) {
          try { results.push(JSON.parse(text.slice(start, j + 1))); } catch(e) {}
          i = j + 1; ended = true; break;
        }
      }
    }
    if (!ended) break;
  }
  if (!results.length) throw new Error('未找到有效JSON，内容：' + text.slice(0, 100));
  return results.reduce(function(a, b) { return Object.keys(a).length >= Object.keys(b).length ? a : b; });
}

// ==================== State ====================
var state = { mistakes: [], exercises: {}, exerciseResults: {}, deferred: [] };

function loadState() {
  window.storage.get('math-app-v3').then(function(r) {
    if (r && r.value) {
      try { var s = JSON.parse(r.value); state = Object.assign(state, s); } catch(e) {}
    }
    updateHome(); renderMistakes();
  }).catch(function() { updateHome(); renderMistakes(); });
}

function saveState() {
  return window.storage.set('math-app-v3', JSON.stringify(state)).catch(function() {});
}

// ==================== Helpers ====================
function today() { return new Date().toLocaleDateString('zh-CN'); }

function getWeekKey() {
  var d = new Date(), day = d.getDay() || 7;
  var mon = new Date(d); mon.setDate(d.getDate() - day + 1);
  return mon.getFullYear() + '-' + mon.getMonth() + '-' + Math.floor(mon.getDate() / 7);
}

function weekRange() {
  var d = new Date(), day = d.getDay() || 7;
  var mon = new Date(d); mon.setDate(d.getDate() - day + 1);
  var sun = new Date(mon); sun.setDate(mon.getDate() + 6);
  return (mon.getMonth()+1) + '/' + mon.getDate() + ' - ' + (sun.getMonth()+1) + '/' + sun.getDate();
}

function showToast(msg) {
  var t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(function() { t.classList.remove('show'); }, 2500);
}

// ==================== Nav ====================
function switchPage(name) {
  document.querySelectorAll('.page').forEach(function(p) { p.classList.remove('active'); });
  document.querySelectorAll('.nav-btn').forEach(function(b) { b.classList.remove('active'); });
  document.getElementById('page-' + name).classList.add('active');
  document.getElementById('nav-' + name).classList.add('active');
  if (name === 'weekly') renderWeekly();
  if (name === 'report') renderReport();
  if (name === 'home') updateHome();
  if (name === 'mistakes') renderMistakes();
}

// ==================== Home ====================
function updateHome() {
  document.getElementById('todayDate').textContent = '今天 ' + today();
  var wk = getWeekKey();
  document.getElementById('stat-today').textContent = state.mistakes.filter(function(m) { return m.date === today(); }).length;
  document.getElementById('stat-week').textContent = state.mistakes.filter(function(m) { return m.weekKey === wk; }).length;
  document.getElementById('stat-mastered').textContent = state.mistakes.filter(function(m) { return m.mastered; }).length;
  var el = document.getElementById('recent-list');
  var recent = state.mistakes.slice().reverse().slice(0, 3);
  if (!recent.length) { el.innerHTML = '<div class="empty-state"><span class="es-icon">😊</span><p>暂无错题记录，太棒了！</p></div>'; return; }
  el.innerHTML = recent.map(function(m) {
    return '<div class="mistake-item"><div><span class="tag ' + (m.mastered ? 'green' : '') + '">' + (m.mastered ? '已掌握' : '待复习') + '</span></div><div class="mistake-info"><h4>' + m.question + '</h4><div>' + m.knowledgePoints.map(function(k) { return '<span class="badge badge-purple">' + k + '</span>'; }).join('') + '</div></div></div>';
  }).join('');
}

// ==================== Camera ====================
var currentImg = null, currentAnalysis = null;

function handleFile(e) {
  var file = e.target.files[0]; if (!file) return;
  var reader = new FileReader();
  reader.onload = function(ev) {
    currentImg = ev.target.result;
    document.getElementById('previewImg').src = ev.target.result;
    document.getElementById('previewImg').style.display = 'block';
    document.getElementById('uploadArea').style.display = 'none';
    document.getElementById('analyzeSection').style.display = 'block';
    document.getElementById('analysisResult').innerHTML = '';
    document.getElementById('saveSection').style.display = 'none';
    currentAnalysis = null;
  };
  reader.readAsDataURL(file);
}

function resetCamera() {
  currentImg = null; currentAnalysis = null;
  document.getElementById('previewImg').style.display = 'none';
  document.getElementById('uploadArea').style.display = 'block';
  document.getElementById('analyzeSection').style.display = 'none';
  document.getElementById('analysisResult').innerHTML = '';
  document.getElementById('saveSection').style.display = 'none';
  document.getElementById('fileInput').value = '';
  var btn = document.getElementById('analyzeBtn');
  btn.textContent = '🤖 开始 AI 分析'; btn.disabled = false;
}

function analyzeHomework() {
  var btn = document.getElementById('analyzeBtn');
  btn.disabled = true; btn.textContent = '分析中...';
  var res = document.getElementById('analysisResult');
  res.innerHTML = '<div class="loading"><span class="spin">⏳</span><p style="margin-top:8px">AI 正在分析作业，请稍候...</p></div>';
  var imgData = currentImg.split(',')[1];
  var mediaType = currentImg.split(';')[0].split(':')[1];
  var prompt = '你是专业小学数学老师（1-3年级），具备手写识别专长。\n\n【手写数字识别规则】\n容易混淆：0和6、1和7、2和7、3和8、5和6，请仔细辨认笔画结构。\n\n【判题规则】\n1. 准确识别每道题目和学生答案\n2. 自己独立计算正确答案\n3. 只有学生答案与正确答案不符才算错题\n4. 不依赖图片上已有批改符号\n\n只返回JSON，不要其他文字：\n{"totalQuestions":总题数,"wrongQuestions":[{"num":"题号","question":"完整题目","studentAnswer":"学生答案","correctAnswer":"正确答案","errorReason":"错误原因","confidence":"high/medium/low","knowledgePoints":["知识点"]}]}\n无法识别则返回{"error":"无法识别作业内容"}\n知识点只从以下选：加法运算、减法运算、乘法运算、除法运算、进位加法、退位减法、数的认识、数的比较、时间认识、图形认识、测量、应用题理解、数位概念、估算';

  callAI({ text: prompt, imageBase64: imgData, mediaType: mediaType, timeoutMs: 30000 })
    .then(function(text) {
      var parsed = extractJSON(text);
      if (parsed.error) {
        res.innerHTML = '<div class="analysis-card"><div class="analysis-header"><h3>⚠️ ' + parsed.error + '</h3></div><div class="analysis-body"><p style="font-size:13px;color:#888">请确保上传清晰的作业照片。</p></div></div>';
      } else {
        currentAnalysis = parsed;
        renderAnalysis(parsed, res);
        document.getElementById('saveSection').style.display = (parsed.wrongQuestions && parsed.wrongQuestions.length) ? 'block' : 'none';
      }
    })
    .catch(function(e) {
      res.innerHTML = '<div class="analysis-card"><div class="analysis-header" style="background:#fff0f5"><h3>⚠️ 分析失败</h3></div><div class="analysis-body"><p style="font-size:13px;color:#888">' + e.message + '</p></div></div>';
    })
    .finally(function() {
      btn.disabled = false; btn.textContent = '🔄 重新分析';
    });
}

function renderAnalysis(data, container) {
  var wrong = data.wrongQuestions || [];
  if (!wrong.length) {
    container.innerHTML = '<div class="analysis-card"><div class="analysis-header" style="background:#f0fff4"><h3 style="color:#00b894">✅ 全部正确！太棒了 🎉</h3></div><div class="analysis-body"><p style="font-size:13px;color:#555">共 ' + data.totalQuestions + ' 道题，未发现错误。</p></div></div>';
    return;
  }
  var items = wrong.map(function(q) {
    var conf = q.confidence === 'low'
      ? '<p style="font-size:12px;color:#e67e22;background:#fff8e1;padding:4px 8px;border-radius:6px;margin-bottom:6px">⚠️ 识别置信度低，建议人工核对</p>'
      : (q.confidence === 'medium' ? '<p style="font-size:12px;color:#888;background:#f5f5f5;padding:4px 8px;border-radius:6px;margin-bottom:6px">🔍 部分数字可能识别有误，建议核对</p>' : '');
    return '<div class="problem-item"><div class="problem-num">' + q.num + '</div><div class="problem-desc">' + q.question + '</div><div style="margin-bottom:4px"><span class="problem-answer">✗ ' + q.studentAnswer + '</span><span class="problem-correct">✓ ' + q.correctAnswer + '</span></div><p style="font-size:12px;color:#666;margin-bottom:6px">💡 ' + q.errorReason + '</p>' + conf + '<div class="knowledge-tags">' + q.knowledgePoints.map(function(k) { return '<span class="badge badge-purple">' + k + '</span>'; }).join('') + '</div></div>';
  }).join('');
  container.innerHTML = '<div class="analysis-card"><div class="analysis-header"><h3>🔍 发现 ' + wrong.length + ' 道错题（共' + data.totalQuestions + '题）</h3></div><div class="analysis-body">' + items + '</div></div>';
}

function handleSave(btn) {
  btn.disabled = true; btn.textContent = '保存中...';
  saveMistakes().finally(function() { btn.disabled = false; btn.textContent = '💾 保存到错题本'; });
}

function saveMistakes() {
  if (!currentAnalysis) { showToast('⚠️ 没有分析结果'); return Promise.resolve(); }
  var wrong = currentAnalysis.wrongQuestions;
  if (!wrong || !wrong.length) { showToast('✅ 没有错题，无需保存'); return Promise.resolve(); }
  var wk = getWeekKey();
  wrong.forEach(function(q) {
    state.mistakes.push({
      id: Date.now() + Math.random(), date: today(), weekKey: wk,
      question: q.question || '未知题目', studentAnswer: q.studentAnswer || '?',
      correctAnswer: q.correctAnswer || '?', errorReason: q.errorReason || '',
      knowledgePoints: (Array.isArray(q.knowledgePoints) && q.knowledgePoints.length) ? q.knowledgePoints : ['其他'],
      mastered: false
    });
  });
  var kps = [];
  wrong.forEach(function(q) { (q.knowledgePoints || []).forEach(function(kp) { if (kps.indexOf(kp) === -1) kps.push(kp); }); });
  kps.forEach(function(kp) { delete state.exercises[kp]; delete state.exerciseResults[kp]; });
  return saveState().then(function() {
    showToast('✅ 已保存 ' + wrong.length + ' 道错题！');
    updateHome(); renderMistakes();
    setTimeout(resetCamera, 800);
  }).catch(function(e) { showToast('⚠️ 保存失败：' + e.message); });
}

// ==================== Mistakes ====================
function renderMistakes() {
  var el = document.getElementById('mistakes-list');
  if (!state.mistakes.length) { el.innerHTML = '<div class="empty-state"><span class="es-icon">😊</span><p>还没有错题记录<br>去拍照分析作业吧！</p></div>'; return; }
  var grouped = {};
  state.mistakes.slice().reverse().forEach(function(m) { if (!grouped[m.date]) grouped[m.date] = []; grouped[m.date].push(m); });
  el.innerHTML = Object.keys(grouped).map(function(date) {
    var items = grouped[date].map(function(m) {
      return '<div class="mistake-item" style="margin-bottom:8px"><div><span class="tag ' + (m.mastered ? 'green' : '') + '">' + (m.mastered ? '已掌握' : '待复习') + '</span></div><div class="mistake-info" style="flex:1"><h4>' + m.question + '</h4><p style="margin-bottom:4px;font-size:12px"><span style="color:#e84393">✗ ' + m.studentAnswer + '</span> → <span style="color:#00b894">✓ ' + m.correctAnswer + '</span></p><div>' + m.knowledgePoints.map(function(k) { return '<span class="badge badge-purple">' + k + '</span>'; }).join('') + '</div></div></div>';
    }).join('');
    return '<div style="margin-bottom:16px"><div style="font-size:13px;color:#888;margin-bottom:8px;font-weight:500">' + date + '</div>' + items + '</div>';
  }).join('');
}

// ==================== Weekly ====================
function renderWeekly() {
  var wk = getWeekKey();
  document.getElementById('weekRange').textContent = weekRange() + ' 周练习';
  var wkMistakes = state.mistakes.filter(function(m) { return m.weekKey === wk || (state.deferred || []).indexOf(m.id) !== -1; });
  var container = document.getElementById('weekly-content');
  if (!wkMistakes.length) { container.innerHTML = '<div class="empty-state" style="padding-top:40px"><span class="es-icon">🎉</span><p>本周还没有错题<br>继续加油！</p></div>'; return; }
  var kpMap = {};
  wkMistakes.forEach(function(m) { m.knowledgePoints.forEach(function(kp) { if (!kpMap[kp]) kpMap[kp] = []; kpMap[kp].push(m); }); });
  var entries = Object.keys(kpMap).map(function(k) { return [k, kpMap[k]]; });
  container.innerHTML = entries.map(function(entry, idx) {
    return '<div class="topic-card" id="tc-' + idx + '"><div class="topic-header" onclick="toggleTopic(\'topic-' + idx + '\')"><div><div class="topic-name">' + entry[0] + '</div><div style="font-size:12px;color:#888;margin-top:2px" id="tc-sub-' + idx + '">生成中 (' + (idx+1) + '/' + entries.length + ')...</div></div><span>▾</span></div><div class="topic-body open" id="topic-' + idx + '"><div style="text-align:center;padding:16px;color:#aaa;font-size:13px">⏳ 正在生成练习题...</div></div></div>';
  }).join('');
  generateAllExercises(entries);
}

function generateAllExercises(entries) {
  var i = 0;
  function next() {
    if (i >= entries.length) return;
    var kp = entries[i][0], ms = entries[i][1], idx = i;
    i++;
    var doGenerate = (!state.exercises[kp] || !state.exercises[kp].length)
      ? generateExercises(kp, ms)
      : Promise.resolve();
    doGenerate.then(function() {
      fillExerciseCard(kp, ms, idx, entries.length);
      setTimeout(next, i < entries.length ? 1000 : 0);
    });
  }
  next();
}

function fillExerciseCard(kp, ms, idx, total) {
  var exs = state.exercises[kp] || [];
  var results = state.exerciseResults[kp] || {};
  var correct = Object.values(results).filter(function(r) { return r; }).length;
  var sub = document.getElementById('tc-sub-' + idx);
  if (sub) sub.textContent = ms.length + '道错题 · ' + exs.length + '道练习';
  var body = document.getElementById('topic-' + idx);
  if (!body) return;
  if (!exs.length) { body.innerHTML = '<p style="font-size:13px;color:#e84393;text-align:center;padding:8px">⚠️ 已用内置题库替代</p>'; return; }
  body.innerHTML = exs.map(function(ex, ei) { return renderExercise(ex, ei, kp, results); }).join('');
  var header = document.querySelector('#tc-' + idx + ' .topic-header');
  if (header) {
    var sp = header.querySelector('span:last-child');
    if (sp) sp.outerHTML = '<div style="display:flex;align-items:center;gap:6px"><span class="badge ' + (correct === exs.length ? 'badge-green' : 'badge-amber') + '">' + correct + '/' + exs.length + '</span><span>▾</span></div>';
  }
}

function renderExercise(ex, ei, kp, results) {
  var answered = results[ei] !== undefined, isCorrect = results[ei];
  var opts = ex.options.map(function(opt, oi) {
    var cls = answered ? (opt === ex.answer ? 'correct' : (oi === ex.chosenIdx ? 'wrong' : '')) : '';
    return '<button class="ans-btn ' + cls + '" onclick="checkAnswer(' + JSON.stringify(kp) + ',' + ei + ',' + JSON.stringify(opt) + ',' + oi + ',' + JSON.stringify(ex.answer) + ',this)" ' + (answered ? 'disabled' : '') + '>' + opt + '</button>';
  }).join('');
  var fb = answered ? (isCorrect ? '✅ 回答正确！' : '❌ 正确答案：' + ex.answer + '　' + (ex.explanation || '')) : '';
  return '<div class="exercise-item"><div class="exercise-q">' + (ei+1) + '. ' + ex.question + '</div><div class="answer-row">' + opts + '</div><div class="exercise-feedback ' + (answered ? 'show ' : '') + (isCorrect ? 'feedback-correct' : 'feedback-wrong') + '">' + fb + '</div></div>';
}

function toggleTopic(id) { document.getElementById(id).classList.toggle('open'); }

// ==================== 内置题库 ====================

  var bank = {
    '加法运算': [{question:'35+48=?',options:['83','73','84'],answer:'83',explanation:'个位进位'},{question:'126+57=?',options:['183','173','193'],answer:'183',explanation:'逐位相加'},{question:'264+135=?',options:['399','389','409'],answer:'399',explanation:'逐位相加'}],
    '减法运算': [{question:'72-38=?',options:['34','44','36'],answer:'34',explanation:'借位减法'},{question:'150-67=?',options:['83','93','73'],answer:'83',explanation:'退位减法'},{question:'200-135=?',options:['65','75','55'],answer:'65',explanation:'连续退位'}],
    '进位加法': [{question:'56+7=?',options:['63','53','64'],answer:'63',explanation:'6+7=13进位'},{question:'78+45=?',options:['123','113','124'],answer:'123',explanation:'双重进位'},{question:'99+1=?',options:['100','99','101'],answer:'100',explanation:'连续进位'}],
    '退位减法': [{question:'43-15=?',options:['28','38','27'],answer:'28',explanation:'借位后13-5=8'},{question:'100-36=?',options:['64','74','54'],answer:'64',explanation:'连续退位'},{question:'82-49=?',options:['33','43','23'],answer:'33',explanation:'借位减法'}],
    '乘法运算': [{question:'7×8=?',options:['54','56','64'],answer:'56',explanation:'口诀七八五十六'},{question:'9×6=?',options:['54','56','63'],answer:'54',explanation:'口诀六九五十四'},{question:'12×4=?',options:['48','44','52'],answer:'48',explanation:'12×4=48'}],
    '除法运算': [{question:'48÷6=?',options:['8','7','9'],answer:'8',explanation:'口诀六八四十八'},{question:'63÷9=?',options:['7','8','6'],answer:'7',explanation:'口诀七九六十三'},{question:'36÷4=?',options:['9','8','7'],answer:'9',explanation:'口诀四九三十六'}],
    '数的认识': [{question:'568里面有几个十？',options:['6','56','5'],answer:'6',explanation:'十位数字是6'},{question:'百位3十位0个位7是？',options:['307','370','37'],answer:'307',explanation:'组成307'},{question:'最大的数是？',options:['398','389','399'],answer:'399',explanation:'逐位比较'}],
    '数的比较': [{question:'356和256哪个大？',options:['356','256','一样'],answer:'356',explanation:'百位3>2'},{question:'231、312、321最小是？',options:['231','312','321'],answer:'231',explanation:'百位2最小'},{question:'499的下一个数？',options:['500','498','501'],answer:'500',explanation:'499+1=500'}],
    '应用题理解': [{question:'有15颗糖给了6颗还剩几颗？',options:['9','8','10'],answer:'9',explanation:'15-6=9'},{question:'一排8棵树种3排共几棵？',options:['24','21','27'],answer:'24',explanation:'8×3=24'},{question:'36人分4组每组几人？',options:['9','8','7'],answer:'9',explanation:'36÷4=9'}]
  };
  return bank[kp] || bank['加法运算'];
}

function generateExercises(kp, mistakes, retry) {
  retry = retry || 0;
  var ex = mistakes.slice(0, 2).map(function(m) { return '"' + m.question + '"（答案' + m.correctAnswer + '）'; }).join('，');
  var prompt = '你是小学数学老师（1-3年级）。针对知识点"' + kp + '"，学生错题：' + ex + '。生成3道选择题。只返回JSON：{"exercises":[{"question":"题目","options":["A","B","C"],"answer":"正确答案（与options完全一致）","explanation":"解析"}]}';
  return callAI({ text: prompt, timeoutMs: 15000 })
    .then(function(text) {
      var parsed = extractJSON(text);
      if (!parsed.exercises || !parsed.exercises.length) throw new Error('结果为空');
      state.exercises[kp] = parsed.exercises;
      return saveState();
    })
    .catch(function(e) {
      if (e.message && e.message.indexOf('429') !== -1 && retry < 2) {
        return new Promise(function(resolve) { setTimeout(resolve, 3000 * (retry + 1)); })
          .then(function() { return generateExercises(kp, mistakes, retry + 1); });
      }
      state.exercises[kp] = getFallbackExercises(kp);
      return saveState();
    });
}

function checkAnswer(kp, idx, chosen, chosenIdx, correct, btn) {
  if (!state.exerciseResults[kp]) state.exerciseResults[kp] = {};
  if (state.exerciseResults[kp][idx] !== undefined) return;
  var isCorrect = chosen === correct;
  state.exerciseResults[kp][idx] = isCorrect;
  if (state.exercises[kp] && state.exercises[kp][idx]) state.exercises[kp][idx].chosenIdx = chosenIdx;
  var container = btn.closest('.exercise-item');
  container.querySelectorAll('.ans-btn').forEach(function(b, i) {
    b.disabled = true;
    if (b.textContent.trim() === correct) b.classList.add('correct');
    else if (i === chosenIdx && !isCorrect) b.classList.add('wrong');
  });
  var fb = container.querySelector('.exercise-feedback');
  var ex = state.exercises[kp] && state.exercises[kp][idx];
  fb.className = 'exercise-feedback show ' + (isCorrect ? 'feedback-correct' : 'feedback-wrong');
  fb.textContent = isCorrect ? '✅ 回答正确！' : '❌ 正确答案：' + correct + '　' + (ex ? ex.explanation || '' : '');
  var results = state.exerciseResults[kp], exs = state.exercises[kp] || [];
  if (exs.length && Object.keys(results).length === exs.length && Object.values(results).every(function(r) { return r; })) {
    state.mistakes.forEach(function(m) { if (m.knowledgePoints.indexOf(kp) !== -1) m.mastered = true; });
    showToast('🎉 已掌握"' + kp + '"！');
  }
  saveState().then(updateHome);
}

// ==================== Report ====================
function renderReport() {
  var wk = getWeekKey();
  document.getElementById('reportWeek').textContent = weekRange() + ' · 学习报告';
  var weekM = state.mistakes.filter(function(m) { return m.weekKey === wk; });
  var kpMap = {};
  weekM.forEach(function(m) { m.knowledgePoints.forEach(function(kp) { if (!kpMap[kp]) kpMap[kp] = { total: 0, mastered: false }; kpMap[kp].total++; if (m.mastered) kpMap[kp].mastered = true; }); });
  var list = document.getElementById('progress-list');
  if (!Object.keys(kpMap).length) { list.innerHTML = '<p style="font-size:13px;color:#888;text-align:center;padding:16px">本周暂无错题数据</p>'; }
  else {
    list.innerHTML = Object.keys(kpMap).map(function(kp) {
      var results = state.exerciseResults[kp] || {}, exs = state.exercises[kp] || [];
      var correct = Object.values(results).filter(function(r) { return r; }).length;
      var pct = exs.length ? Math.round(correct / exs.length * 100) : 0;
      var color = pct >= 100 ? '#00b894' : pct >= 60 ? '#6c5ce7' : '#e84393';
      return '<div class="progress-item"><div class="progress-label"><span>' + kp + '</span><span style="color:' + color + ';font-weight:500">' + pct + '%</span></div><div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%;background:' + color + '"></div></div></div>';
    }).join('');
  }
  var deferred = weekM.filter(function(m) { return !m.mastered; });
  var deferCard = document.getElementById('deferred-card');
  if (deferred.length) {
    deferCard.style.display = 'block';
    var dkps = [];
    deferred.forEach(function(m) { m.knowledgePoints.forEach(function(kp) { if (dkps.indexOf(kp) === -1) dkps.push(kp); }); });
    document.getElementById('deferred-list').innerHTML = dkps.map(function(kp) { return '<div class="deferred-item"><h4>' + kp + '</h4><p>尚未完全掌握，将递延到下周继续练习</p></div>'; }).join('');
  } else deferCard.style.display = 'none';
  var total = weekM.length, mastered = weekM.filter(function(m) { return m.mastered; }).length;
  document.getElementById('report-summary').innerHTML = total
    ? '本周共记录 <b>' + total + '</b> 道错题，已掌握 <b>' + mastered + '</b> 道。' + (deferred.length ? '还有 <b>' + deferred.length + '</b> 道需要继续努力！' : '全部掌握，太厉害了！🎉')
    : '本周还没有错题记录，继续保持！';
}

// ==================== Init ====================
document.getElementById('apiKeyBtn').addEventListener('click', openModal);
// 沙盒里更新按钮文字提示
if (isInSandbox()) {
  document.getElementById('apiKeyBtn').textContent = '🤖 Anthropic';
}
loadState();
</script>
